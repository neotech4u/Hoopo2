name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types: [published, created]

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Initialize Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Hoopoe-Car-Companion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoopoe-car-companion-debug-apk
          path: build-output/Hoopoe-Car-Companion.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/Hoopoe-Car-Companion.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
